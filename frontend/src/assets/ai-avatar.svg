  <!-- Sparkle top -->
  <path d="M 50 10 L 52 17 L 59 17 L 53.5 21 L 55.5 28 L 50 24 L 44.5 28 L 46.5 21 L 41 17 L 48 17 Z" fill="white" opacity="0.9"/>
